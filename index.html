<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無人機都市避障挑戰賽</title>
    <!-- 引入外部樣式 -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Three.js 與視角控制器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- 左側操作與程式碼面板 -->
    <div id="sidebar">
        <div class="header">
            <h1>無人機都市避障挑戰賽</h1>
            <p>地圖 100x100 | 限高 25m | 實體都市與黑盒子評測</p>
        </div>

        <!-- 種子碼控制區 -->
        <div class="input-group">
            <label for="map-seed">地圖種子碼 (Seed)</label>
            <div class="seed-row">
                <input type="number" id="map-seed" value="5655">
                <button class="btn-secondary" id="random-seed-btn">🎲 換新種子</button>
                <button class="btn-secondary" id="apply-seed-btn">重繪地圖</button>
            </div>
        </div>

        <!-- AI 提示詞指引卡片 -->
        <div class="ai-banner">
            <span>💡 讓外部 AI 幫你寫策略</span>
            <button id="open-prompt-modal-btn">取得 AI 提示詞</button>
        </div>

        <!-- 避障策略輸入區 -->
        <div id="code-area">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-size: 0.82rem; font-weight: bold; color: #b0b0c0;">避障策略腳本</label>
                <span id="save-hint" style="font-size: 0.72rem; color: #00ff88; display: none;">已自動儲存</span>
            </div>
            <textarea id="controller-code" spellcheck="false"></textarea>
        </div>

        <!-- 執行按鈕 -->
        <button id="run-btn">🚀 開始模擬試飛</button>

        <!-- 競賽評測計分板與黑盒子下載 -->
        <div id="scoreboard">
            <div class="score-title">
                <span>📊 競賽評測計分板</span>
                <span id="score-status" style="color: #bbb;">未開始</span>
            </div>
            <div class="score-row">
                <span>直達終點 3D 直線距離：</span>
                <span class="score-val highlight" id="score-remain-dist">-- m</span>
            </div>
            <div class="score-row">
                <span>水平推進剩餘距離：</span>
                <span class="score-val" id="score-horiz-dist">-- m</span>
            </div>
            <div class="score-row">
                <span>航程探索達成率：</span>
                <span class="score-val" id="score-progress">0.0 %</span>
            </div>

            <!-- 黑盒子飛行日誌下載按鈕 -->
            <button id="download-log-btn" class="btn-secondary" disabled>
                💾 下載黑盒子飛行日誌 (.txt)
            </button>
        </div>
    </div>

    <!-- 右側 3D 視覺化畫布與 HUD -->
    <div id="viewer">
        <div id="hud">
            <div>狀態: <span id="flight-status" style="color: #bbb;">準備就緒</span></div>
            <div>時間: <span id="flight-time">0.00</span> 秒</div>
            <div>高度: <span
